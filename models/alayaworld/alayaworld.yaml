source:
  path: AlayaWorld
  url: https://github.com/AlayaLab/AlayaWorld.git
  revision: ea03cfbb2e4c4e9102ed8ea8562e0b5370ca9b79

assets:
  # The public v1.0 bundle carries the LTX-2.3 architecture metadata and VAE.
  # The complete v1.1 stage2b transformer below replaces its DiT weights before
  # the distilled stage3 LoRA is applied.
  base_model:
    path: checkpoints/ltx-2.3/merged_infer.safetensors
    repo_id: AlayaLab/AlayaWorld
    revision: f9699009a00f93214d8d2942d6546f3fa5398bea
  ar_transformer:
    path: checkpoints/alaya-world-v1-1-ar/transformer.pt
    repo_id: AlayaLab/AlayaWorld-v1.1-stage2b
    revision: 17f2f8a4939d85920b8a6c5191ce88dec7f862d1
  history_encoder:
    path: checkpoints/alaya-world-v1-1-ar/history_encoder.pt
    repo_id: AlayaLab/AlayaWorld-v1.1-stage2b
    revision: 17f2f8a4939d85920b8a6c5191ce88dec7f862d1
  dmd_lora:
    path: checkpoints/alaya-world-v1-1-dmd/lora.safetensors
    repo_id: AlayaLab/AlayaWorld-v1.1-stage3
    revision: 75fef054c5c0f86fd1450d50f70ef2f0a93fff2b
  gemma:
    path: checkpoints/gemma-3-12b-it-qat-q4_0-unquantized
    repo_id: google/gemma-3-12b-it-qat-q4_0-unquantized
    revision: 68f7ee4fbd59087436ada77ed2d62f373fdd4482
  vigeo_source:
    path: third_party/ViGeo
    url: https://github.com/aigc3d/ViGeo.git
    revision: 87ee8fbe1f8f4ddda473b4f2562b80979a76305f
  vigeo_checkpoint:
    path: third_party/ViGeo/checkpoints/ViGeo1.1/vigeo.pt
    repo_id: pkqbajng/ViGeo1.1
    revision: 49103e6eeab888bae974251d3578b496bec711d7

inference:
  config: configs/infer_i2v_camera.yaml
  seed: 1234
  # Compile neutral and moving initial turns plus the history-conditioned path
  # before the Runtime becomes available, so viewers receive steady turns.
  compile: default
  warmup_chunks: 3
  # FlashAttention 4 is installed for B200. Set this to pytorch only for
  # debugging: full-resolution attention is substantially slower and larger.
  attention_backend: flash_attention_4

inputs:
  upload_template: playground/case1/case1
  random_images:
    - playground/case1/case1
    - playground/case2/case2

memory:
  max_spatial_frames: 320
  recent_spatial_frames: 160

stream:
  max_chunks_per_rollout: 512

motion:
  strafe_units_per_second: 0.126
  vertical_units_per_second: 0.261
  forward_units_per_second: 1.905
  pitch_degrees_per_second: 4.039
  yaw_degrees_per_second: 9.375
  roll_degrees_per_second: 4.094
