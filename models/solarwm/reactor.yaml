$schema: reactor/v1

model:
  name: solarwm-5b-stage2
  version: v0.1.0
  description: |
    Explore SolarWM's autoregressive Wan2.2 TI2V-5B world from an uploaded
    image, a prompt, and six-axis camera motion.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "8"
      limit: "16"
    memory:
      request: 64Gi
      limit: 160Gi

runtime:
  import: solarwm_reactor:SolarWM
  config: solarwm.yaml
  weights_path: /opt/dlami/nvme/.cache_hf/SolarWM
