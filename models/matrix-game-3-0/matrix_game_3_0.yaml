source:
  path: Matrix-Game
  url: https://github.com/SkyworkAI/Matrix-Game.git
  revision: 71c3cd7f741311f8100f6cf9cde942b6c1378d11

checkpoint:
  repo_id: Skywork/Matrix-Game-3.0
  revision: 382aa382a03cec057360755aa72c7735025770bb

inference:
  # The public fast recipe: distilled 5B DiT, three denoising steps, INT8
  # attention projections, and the 0.75-pruned MG-LightVAE v2 decoder.
  size: 704*1280
  seed: 42
  num_inference_steps: 3
  sample_shift: 5.0
  guide_scale: 5.0
  use_int8: true
  vae_type: mg_lightvae_v2
  lightvae_pruning_rate: 0.75

stream:
  # Upstream's default interactive inference length. Chunk 1 is 57 frames;
  # chunks 2-12 are 40 frames each, for 497 generated frames in one rollout.
  max_chunks: 12
  chunk_timeout_seconds: 1800

examples:
  - name: animated_city
    image: example_images/001.png
    prompt: A colorful, animated cityscape with a gas station and various buildings.
  - name: desert_town
    image: example_images/002.png
    prompt: A desert town with wooden buildings, cacti, and palm trees under a clear blue sky.
  - name: tropical_path
    image: example_images/003.png
    prompt: A tropical scene with palm trees, rocks, and a path under a cloudy sky.
  - name: pixel_village
    image: example_images/004.png
    prompt: A pixelated village scene with houses, trees, and gravestones in a grassy landscape.
  - name: graffiti_alley
    image: example_images/005.png
    prompt: A vibrant pink graffiti on a wall in an urban alleyway at night.
  - name: ancient_ruins
    image: example_images/006.png
    prompt: An ancient stone structure with overgrown vegetation and a set of stairs.
  - name: low_poly_forest
    image: example_images/007.png
    prompt: A vibrant, low-poly forest scene with a path, trees, and colorful flowers.
  - name: futuristic_corridor
    image: example_images/008.png
    prompt: A futuristic corridor with metallic walls, doors, and emergency equipment.
  - name: systems_alley
    image: example_images/009.png
    prompt: A nighttime scene of an urban alleyway with graffiti-covered walls and a sign for the "Center of Systems."
  - name: snowy_fence
    image: example_images/010.png
    prompt: A snowy landscape with trees, a fence, and logs, viewed from different angles.
