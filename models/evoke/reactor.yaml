# Reactor model spec for the EVOKE recipe.
#
# `$schema` pins the schema this file is written against — reactor/v1 is the
# current one. Keep it as the first line.
$schema: reactor/v1

model:
  # Change this to a name unique to your account before publishing. Release
  # tags are immutable, so bump version after every successful publish.
  name: evoke-post-distillation
  version: v0.0.1
  description: |
    Explore an autoregressive world through text, media, and six-axis camera motion.

  # EVOKE keeps its transformer, text encoder, VAE, ViGeo estimator, geometric
  # bank, and streaming caches resident for the session. The distilled model
  # needs a Hopper or Blackwell accelerator with enough memory for the full
  # release inference path.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    memory:
      request: 8Gi
      limit: 128Gi

runtime:
  import: evoke:Evoke
  config: evoke.yaml
  # Source, the isolated Python 3.10 worker, model snapshots, and compiler
  # caches live beneath this persistent mount. Change it to a large local disk
  # before the first run when the home filesystem is space constrained.
  weights_path: ~/.cache/reactor_registry/evoke

build:
  # Reactor renders the image definition from this block in memory. EVOKE
  # clones its pinned public source on first load and its v2v reader links to
  # the X11/audio libraries bundled by these Debian runtime packages.
  runtime_version: "3.1.2"
  system_packages:
    - ffmpeg
    - git
    - libx11-6
    - libxau6
    - libxcb1
    - libxdmcp6
    - libxext6

recording:
  enabled: true
  chunk_seconds: 6
  clip_max_seconds: 300
  video_track: main_video
  video:
    codec: h264
    preset: veryfast
    crf: 23
